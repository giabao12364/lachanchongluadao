services:
  db:
    image: postgres:16
    container_name: lachan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lachan_user
      POSTGRES_PASSWORD: lachan_pass
      POSTGRES_DB: lachan_db
    ports:
      - "5433:5432"
    volumes:
      - lachan_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lachan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lachan_fastapi
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lachan_user:lachan_pass@db:5432/lachan_db
      - DATABASE_URL_SYNC=postgresql+psycopg2://lachan_user:lachan_pass@db:5432/lachan_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  lachan_pgdata:
